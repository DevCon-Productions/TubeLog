<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TubeLog — History</title>
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <div class="container">
      <h1>TubeLog</h1>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="totalVideos">0</div>
          <div class="stat-label">Videos Watched</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="totalRuntime">0m</div>
          <div class="stat-label">Total Runtime</div>
        </div>
      </div>
      <div id="videoList"></div>
    </div>
    <script src="history.js"></script>
  </body>
</html>
